name: Release

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish Wheel to Artifact Registry
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Auth for Artifact Registry Access
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.GCP_GITHUB_OIDC_PROVIDER }}
          service_account: ${{ vars.ARTIFACT_WRITER_SA }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Check if version already published
        id: version-check
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          VERSION=$(python3 -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])")
          PKG_NAME=$(python3 -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['name'])")
          PKG_SLUG="${PKG_NAME//_/-}"
          echo "Checking if ${PKG_NAME}==${VERSION} is already published..."
          RESPONSE=$(curl -sf \
            -u "oauth2accesstoken:${ACCESS_TOKEN}" \
            "https://us-central1-python.pkg.dev/pickle-devops-prod/python-internal/simple/${PKG_SLUG}/" \
            2>/dev/null || echo "")
          if echo "$RESPONSE" | grep -qi "${PKG_SLUG}-${VERSION}"; then
            echo "Version ${PKG_NAME}==${VERSION} already published, skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Version ${PKG_NAME}==${VERSION} not yet published, will publish."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Build wheel
        if: steps.version-check.outputs.skip != 'true'
        run: uv build --wheel

      - name: Publish to Artifact Registry
        if: steps.version-check.outputs.skip != 'true'
        env:
          UV_PUBLISH_URL: https://us-central1-python.pkg.dev/pickle-devops-prod/python-internal/
          UV_PUBLISH_USERNAME: oauth2accesstoken
          UV_PUBLISH_PASSWORD: ${{ steps.auth.outputs.access_token }}
        run: uv publish
