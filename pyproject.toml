[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genpy"
dynamic = ["version"]
description = "Python ROS message and service generators"
license = "BSD-3-Clause"
authors = [
    {name = "Ken Conley"},
    {name = "Troy Straszheim"},
    {name = "Morten Kjaergaard"},
    {name = "Dirk Thomas"},
]
keywords = ["ROS", "robotics", "messages"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
# genmsg is Pickle's fork (https://github.com/Pickle-Robot/genmsg), not on PyPI;
# install it from the python-internal registry or from git. pyyaml is imported by
# genpy.message at package import time (package.xml lists python3-yaml).
dependencies = ["genmsg", "pyyaml"]

# The wheel version is composed at build time from the upstream version, a
# monotonic release counter and (off main) the branch name; see _pickle_version.py.
[tool.hatch.version]
source = "code"
path = "_pickle_version.py"
expression = "get_version()"

[tool.hatch.build.targets.wheel]
packages = ["src/genpy"]
